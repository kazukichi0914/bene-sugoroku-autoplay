<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { font: 12px system-ui, sans-serif; width: 360px; margin: 10px; }
  button { margin-right: 6px; padding: 4px 10px; }
  #info { margin: 8px 0; color: #444; white-space: pre-line; }
  #play { margin-top: 8px; padding: 6px; border-radius: 4px; background: #eee; font-weight: bold; }
  #play.can { background: #fff3cd; color: #7a5b00; }
  #play.used { background: #e3f2e5; color: #2e7d32; }
  pre { background: #f4f4f4; padding: 6px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
  <button id="run">今すぐ実行</button>
  <button id="dry">判定のみ(ドライラン)</button>
  <div id="play"></div>
  <div id="info"></div>
  <pre id="logs"></pre>
  <script src="popup.js"></script>
</body>
</html>
